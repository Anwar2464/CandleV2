<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Candle — Puppet Transformation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;color:#fff;font-family:Consolas,monospace}
#stage{position:fixed;inset:0;overflow:hidden;background:#03040a}
.scene{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 1.3s ease,transform 5s ease;filter:contrast(1.04) saturate(1.05)}
#young{opacity:1;transform:scale(1.03)}
#puppet{transform:scale(1.09)}
.shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.52),transparent 40%,rgba(0,0,0,.1)),radial-gradient(ellipse,transparent 35%,rgba(0,0,0,.65))}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#flash{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 75%,#fff8b0 0%,#ffb52d 12%,#ff4a08 35%,#a00d05 62%,#050207 100%);mix-blend-mode:screen}
#caption{position:absolute;z-index:8;left:50%;bottom:6vh;transform:translateX(-50%);text-align:center;letter-spacing:.22em;color:#ffd39a;text-shadow:0 0 18px #ff4b12;font-size:clamp(11px,1.8vw,17px);width:90%;opacity:0;transition:opacity .6s}
#status{position:absolute;z-index:8;left:15px;top:18px;font-size:11px;letter-spacing:.16em;color:#ffffff9a}
#replay{position:absolute;right:15px;top:14px;z-index:10;padding:10px 13px;border:1px solid #96582e;border-radius:7px;background:#140c09e8;color:#ffd39a;cursor:pointer;font:inherit}
#replay:hover{background:#2c170d}
#candle{position:absolute;z-index:6;width:clamp(23px,3.3vw,48px);height:clamp(90px,18vh,150px);left:50%;top:56%;opacity:0;transform:translate(-50%,-50%);transform-origin:50% 90%;filter:drop-shadow(0 0 12px #ff6a19)}
.wax{position:absolute;bottom:0;left:18%;width:64%;height:83%;border-radius:7px;background:linear-gradient(90deg,#766156,#f7e4c4 28%,#fff5df 52%,#d2b396 82%,#625046)}
.waxTop{position:absolute;top:14%;left:18%;width:64%;height:8%;border-radius:50%;background:#fff0d4}
.wick{position:absolute;top:5%;left:49%;width:3px;height:14%;background:#251b17}
#smallFlame{position:absolute;left:50%;top:-3%;width:54%;height:24%;transform:translateX(-50%);border-radius:70% 30% 65% 35%;background:radial-gradient(ellipse at 50% 72%,#fff9b2 0 14%,#ffbd37 35%,#ff4a0b 68%,transparent 72%);filter:drop-shadow(0 0 12px #ff6a12);opacity:0;animation:flicker .13s infinite alternate}
@keyframes flicker{to{transform:translateX(-50%) rotate(7deg) scale(1.1,.93)}}
#strings{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;opacity:0;transition:opacity .8s}
@media(max-width:600px){.scene{object-position:center}.shade{background:linear-gradient(0deg,rgba(0,0,0,.48),transparent 35%),radial-gradient(ellipse,transparent 30%,rgba(0,0,0,.5))}}
</style>
</head>

let W=innerWidth,H=innerHeight,dpr=1,start=performance.now(),embers=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const c of [fx,strings]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function say(t,on=true){caption.textContent=t;caption.style.opacity=on?'1':'0'}
function drawFire(power){
 fctx.clearRect(0,0,W,H); if(power<=0)return;
 for(let i=0;i<70*power;i++){
  const x=Math.random()*W, h=(.15+Math.random()*.75)*H*power, w=10+Math.random()*65;
  const g=fctx.createLinearGradient(x,H,x,H-h);
  g.addColorStop(0,`rgba(255,245,130,${.28*power})`);g.addColorStop(.25,`rgba(255,115,10,${.28*power})`);g.addColorStop(.7,`rgba(255,30,3,${.15*power})`);g.addColorStop(1,'rgba(40,0,0,0)');
  fctx.fillStyle=g;fctx.beginPath();fctx.moveTo(x-w/2,H);
  fctx.bezierCurveTo(x-w,H-h*.25,x+w,H-h*.55,x+Math.random()*w-w/2,H-h);
  fctx.bezierCurveTo(x+w,H-h*.5,x+w*.6,H-h*.15,x+w/2,H);fctx.fill();
 }
 if(Math.random()<power*.9)embers.push({x:Math.random()*W,y:H+4,vx:Math.random()*2-1,vy:-2-Math.random()*6,life:.6+Math.random()*1.1,age:0,r:1+Math.random()*3});
 for(const p of embers){p.x+=p.vx;p.y+=p.vy;p.age+=1/60}
 embers=embers.filter(p=>p.age<p.life&&p.y>-10);
 for(const p of embers){fctx.globalAlpha=(1-p.age/p.life)*power;fctx.fillStyle=Math.random()>.5?'#ffb52e':'#ff4c12';fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,Math.PI*2);fctx.fill()}
 fctx.globalAlpha=1;
}
function drawStrings(time,show){
 sctx.clearRect(0,0,W,H);if(!show)return;
 const sx=W*.66, sy=H*.17;
 // Thread ends are animated subtly to suggest a puppet master moving his fingers.
 const sway=Math.sin(time*.002)*12, pulse=Math.sin(time*.003);
 const targets=[[W*.74,H*.67],[W*.78,H*.72],[W*.81,H*.76],[W*.76,H*.82],[W*.71,H*.73]];
 sctx.lineWidth=1.5;sctx.strokeStyle='rgba(235,232,255,.78)';sctx.shadowColor='#b9d8ff';sctx.shadowBlur=5;
 for(let i=0;i<targets.length;i++){
  const [tx,ty]=targets[i];
  sctx.beginPath();sctx.moveTo(sx+(i-2)*15+sway,sy);
  sctx.bezierCurveTo(sx+(i-2)*35,sy+H*.22,tx-30,ty-H*.1,tx,ty);
  sctx.stroke();
  sctx.fillStyle='#fff1d0';sctx.beginPath();sctx.arc(tx,ty,1.8+pulse*.4,0,Math.PI*2);sctx.fill();
 }
 sctx.shadowBlur=0;
}
function frame(now){
 const t=(now-start)/1000;
 // First scene: subtle camera motion and a small chess move.
 if(t<2.1){
  young.style.opacity='1';puppet.style.opacity='0';young.style.transform=`scale(${1.03+Math.sin(now*.0004)*.012})`;
  candle.style.opacity='0';flash.style.opacity='0';say('A QUIET GAME');
  drawFire(0);drawStrings(now,false);
 }else if(t<2.8){
  candle.style.opacity='1';candle.style.left='50%';candle.style.top='57%';
  candle.style.transform=`translate(-50%,-50%) rotate(${ease((t-2.1)/.7)*88}deg)`;
  smallFlame.style.opacity='0';say('THE CANDLE FALLS');
  drawFire(ease((t-2.1)/.7)*.1);drawStrings(now,false);
 }else if(t<4.7){
  candle.style.transform='translate(-50%,-50%) rotate(88deg)';smallFlame.style.opacity='1';
  const p=ease((t-2.8)/1.4);flash.style.opacity=String(p*.98);say('IGNITE');
  drawFire(p);drawStrings(now,false);
 }else if(t<5.5){
  young.style.opacity='0';puppet.style.opacity='1';puppet.style.transform='scale(1.02)';
  flash.style.opacity=String(Math.max(0,1-(t-4.7)*1.25));drawFire(Math.max(0,1-(t-4.7)));
  candle.style.opacity='0';say('',false);drawStrings(now,false);
 }else{
  young.style.opacity='0';puppet.style.opacity='1';
  puppet.style.transform=`scale(${1.02+Math.min(.05,(t-5.5)*.009)})`;
  flash.style.opacity='0';drawFire(0);candle.style.opacity='0';
  // Puppet strings sway and pulse over the final image. The girl image remains a still illustration.
  drawStrings(now,true);say('EVERY MOVE IS MINE',t<9);
  if(t>10.5){start=now;embers=[];young.style.opacity='1';puppet.style.opacity='0';strings.style.opacity='0'}
  else strings.style.opacity='1';
 }
 requestAnimationFrame(frame);
}
document.querySelector('#replay').addEventListener('click',()=>{start=performance.now();embers=[];strings.style.opacity='0';young.style.opacity='1';puppet.style.opacity='0';candle.style.opacity='0';flash.style.opacity='0'});
requestAnimationFrame(frame);
</script>
