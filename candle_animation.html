<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Candle Animation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #050505; font-family: Consolas, "Courier New", monospace;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; left: 14px; bottom: 12px; color: #777;
    font: 12px Consolas, monospace; user-select: none;
  }
  .replay {
    position: fixed; right: 14px; bottom: 12px; padding: 9px 13px;
    color: #ffbd67; background: #15100c; border: 1px solid #5a351b;
    border-radius: 6px; font: 13px Consolas, monospace; cursor: pointer;
  }
  .replay:hover { background: #24170e; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Animation d'une bougie qui tombe et s'enflamme"></canvas>
<div class="hint">CANDLE.EXE · animation</div>
<button class="replay" id="replay">↻ Rejouer</button>
<script>
(() => {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const replay = document.getElementById("replay");
  let W = 0, H = 0, dpr = 1, start = performance.now();
  let particles = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = t => { t = clamp(t, 0, 1); return t*t*(3-2*t); };

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  function flame(x, y, scale, time, intense = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const flicker = Math.sin(time * 0.013) * 2 + Math.sin(time * 0.027) * 1.4;
    // Halo lumineux
    const glow = ctx.createRadialGradient(0, -12, 1, 0, -12, 42);
    glow.addColorStop(0, `rgba(255,110,15,${0.27 * intense})`);
    glow.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, -12, 42, 0, Math.PI*2); ctx.fill();

    // Outer flame
    ctx.fillStyle = "#f04412";
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.bezierCurveTo(-17, 1, -13 + flicker, -16, 1 + flicker, -35 - Math.abs(flicker));
    ctx.bezierCurveTo(5, -21, 19, -18, 12, -4);
    ctx.bezierCurveTo(22, 5, 10, 12, 0, 12);
    ctx.fill();

    // Inner orange flame
    ctx.fillStyle = "#ff9a20";
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.bezierCurveTo(-9, 1, -6, -10, 2 + flicker*0.5, -23);
    ctx.bezierCurveTo(12, -11, 13, 0, 0, 10);
    ctx.fill();

    // Hot core
    ctx.fillStyle = "#fff3b0";
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-4, 1, -2, -5, 2, -12);
    ctx.bezierCurveTo(7, -3, 5, 4, 0, 8);
    ctx.fill();
    ctx.restore();
  }

  function drawCandle(x, y, angle, scale, time, lit) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    const cw = 36, ch = 150;
    // Candle shadow
    ctx.fillStyle = "rgba(0,0,0,.6)";
    roundedRect(-cw/2 + 7, -ch + 8, cw, ch, 7); ctx.fill();

    // Wax body with a soft gradient
    const wax = ctx.createLinearGradient(-cw/2, 0, cw/2, 0);
    wax.addColorStop(0, "#8b7770");
    wax.addColorStop(.18, "#f4e4c8");
    wax.addColorStop(.52, "#fff4dc");
    wax.addColorStop(.82, "#d7bda0");
    wax.addColorStop(1, "#78635b");
    ctx.fillStyle = wax;
    roundedRect(-cw/2, -ch, cw, ch, 6); ctx.fill();

    // Top rim and melted wax
    ctx.fillStyle = "#fff0d2";
    ctx.beginPath();
    ctx.ellipse(0, -ch + 2, cw/2, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#c5a88b";
    ctx.beginPath();
    ctx.ellipse(0, -ch + 4, 8, 3.5, 0, 0, Math.PI*2); ctx.fill();

    // Wick
    ctx.strokeStyle = "#28201a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -ch - 1); ctx.lineTo(1, -ch - 13); ctx.stroke();

    if (lit) flame(1, -ch - 15, 0.9, time, 1.15);
    ctx.restore();
  }

  function reset() { start = performance.now(); particles = []; }
  replay.addEventListener("click", reset);

  function draw(now) {
    const t = (now - start) / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, W, H);

    // Very subtle floor glow
    const floor = ctx.createRadialGradient(W/2, H*.83, 5, W/2, H*.83, W*.43);
    floor.addColorStop(0, "rgba(255,92,18,.09)");
    floor.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = floor; ctx.fillRect(0, 0, W, H);

    const scale = clamp(Math.min(W/700, H/650), .62, 1.12);
    const cx = W/2;
    const standingY = H*.77;
    const fallStart = 2.5, fallEnd = 3.35, igniteAt = 3.75;

    let x = cx, y = standingY, angle = 0, lit = false;
    if (t < fallStart) {
      // La bougie reste droite quelques secondes
      y = standingY + Math.sin(now*.002)*1.2;
      lit = false;
    } else if (t < fallEnd) {
      const p = smooth((t-fallStart)/(fallEnd-fallStart));
      angle = p * (Math.PI/2 - .05);
      x = cx + p*95*scale;
      y = standingY + p*30*scale;
      lit = false;
    } else {
      angle = Math.PI/2 - .05;
      x = cx + 95*scale;
      y = standingY + 30*scale;
      lit = t >= igniteAt;
    }

    // A few sparks appear after the candle lands and catches fire
    if (lit && Math.random() < .28) {
      particles.push({
        x: x + (Math.random()-.5)*90*scale,
        y: y - Math.random()*20*scale,
        vx: (Math.random()-.5)*1.1,
        vy: -Math.random()*2.2 - .3,
        life: .7 + Math.random()*.8,
        age: 0, size: 1 + Math.random()*2.2
      });
    }
    const dt = 1/60;
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy -= .015; p.age += dt; }
    particles = particles.filter(p => p.age < p.life);
    for (const p of particles) {
      ctx.globalAlpha = 1-p.age/p.life;
      ctx.fillStyle = p.age < p.life*.5 ? "#ffb347" : "#ff4b12";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Candle is drawn from its bottom center; angle makes it fall sideways
    drawCandle(x, y, angle, scale, now, lit);

    if (t > 9) {
      // Loop back smoothly after a pause
      start = now;
      particles = [];
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
