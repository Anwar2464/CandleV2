<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candle Transformation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;color:#fff;font-family:Consolas,monospace}
#stage{position:fixed;inset:0;background:#03040a;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 1.2s ease;filter:saturate(.9)}
#young{opacity:1}
#older{transform:scale(1.04);transition:opacity 1.1s ease,transform 5s ease}
#fire{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.7) 100%)}
#caption{position:absolute;z-index:8;left:50%;bottom:7vh;transform:translateX(-50%);font-size:clamp(12px,2vw,18px);letter-spacing:.22em;color:#f8c68a;text-shadow:0 0 14px #ff4b12;text-align:center;white-space:nowrap;opacity:0;transition:opacity 1s}
#candle{position:absolute;z-index:7;width:clamp(24px,4vw,54px);height:clamp(100px,20vh,180px);left:50%;top:50%;opacity:0;transform:translate(-50%,-50%) rotate(0deg);transform-origin:50% 90%;filter:drop-shadow(0 0 10px rgba(255,100,20,.6))}
.wax{position:absolute;bottom:0;left:18%;width:64%;height:83%;border-radius:8px 8px 5px 5px;background:linear-gradient(90deg,#746257,#f8e5c5 28%,#fff4dc 52%,#d0b296 82%,#594940);box-shadow:inset 2px 0 3px #fff8}
.top{position:absolute;top:14%;left:18%;width:64%;height:8%;border-radius:50%;background:#fff0d4;border:1px solid #bda183}
.wick{position:absolute;top:5%;left:49%;width:3px;height:14%;background:#241b17;border-radius:3px}
.flame{position:absolute;left:50%;top:-3%;width:50%;height:24%;transform:translateX(-50%);border-radius:70% 30% 65% 35%;background:radial-gradient(ellipse at 50% 72%,#fff7b0 0 14%,#ffbd37 35%,#ff4a0b 68%,transparent 72%);filter:drop-shadow(0 0 12px #ff6a12);animation:flicker .12s infinite alternate;opacity:0}
@keyframes flicker{from{transform:translateX(-50%) rotate(-5deg) scale(.9,1.05)}to{transform:translateX(-50%) rotate(6deg) scale(1.08,.92)}}
#replay{position:absolute;right:16px;top:16px;z-index:10;border:1px solid #a65b26;background:#120b08d9;color:#ffd2a0;padding:10px 14px;border-radius:7px;cursor:pointer;font:inherit}
#replay:hover{background:#2a150b}
#hint{position:absolute;left:16px;top:20px;z-index:10;color:#ffffff8a;font-size:11px;letter-spacing:.16em}
#fullFire{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 80%,#fff7a0 0%,#ffb02d 13%,#ff4a08 36%,#8e0805 62%,#080206 100%);mix-blend-mode:screen;transition:opacity .35s}
@media(max-width:600px){.scene{object-position:center}#caption{white-space:normal;width:90%;line-height:1.6}}
</style>
</head>
<body>
<div id="stage">
  <img id="young" class="scene" alt="Young anime character">
  <img id="older" class="scene" alt="Dramatic older anime character">
  <div class="vignette"></div>
  <div id="fullFire"></div>
  <canvas id="fire"></canvas>
  <div id="candle" aria-label="animated candle">
    <div class="wax"></div><div class="top"></div><div class="wick"></div><div class="flame" id="candleFlame"></div>
  </div>
  <div id="caption"></div>
  <div id="hint">CANDLE TRANSFORMATION // ANIMATION</div>
  <button id="replay">↻ Replay</button>
</div>

let W=innerWidth,H=innerHeight,dpr=1,start=performance.now(),embers=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function burst(){for(let i=0;i<180;i++)embers.push({x:rand(0,W),y:H+rand(0,100),vx:rand(-2,2),vy:rand(-8,-2),life:rand(.7,2),age:0,size:rand(1,5)})}
function drawFire(now,amount){
  ctx.clearRect(0,0,W,H);
  if(amount<=0){embers=[];return}
  // Flames rise from the bottom and grow until they cover the whole screen.
  for(let i=0;i<Math.floor(95*amount);i++){
    const x=rand(0,W), height=rand(H*.12,H*.8)*amount, width=rand(12,75);
    const g=ctx.createLinearGradient(x,H,x,H-height);
    g.addColorStop(0,`rgba(255,245,135,${.24*amount})`);
    g.addColorStop(.22,`rgba(255,125,15,${.24*amount})`);
    g.addColorStop(.7,`rgba(255,38,5,${.13*amount})`);
    g.addColorStop(1,'rgba(70,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-width/2,H);
    ctx.bezierCurveTo(x-width,H-height*.25,x+width,H-height*.6,x+rand(-width,width),H-height);
    ctx.bezierCurveTo(x+width*1.2,H-height*.55,x+width*.5,H-height*.2,x+width/2,H);
    ctx.fill();
  }
  if(Math.random()<.7*amount)embers.push({x:rand(0,W),y:H+5,vx:rand(-1.5,1.5),vy:rand(-5,-1),life:rand(.5,1.7),age:0,size:rand(1,3.5)});
  for(const p of embers){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.age+=1/60}
  embers=embers.filter(p=>p.age<p.life&&p.y>-20);
  for(const p of embers){ctx.globalAlpha=(1-p.age/p.life)*amount;ctx.fillStyle=Math.random()>.5?'#ffb52e':'#ff4c12';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
}
function setCaption(text,show=true){caption.textContent=text;caption.style.opacity=show?'1':'0'}
function frame(now){
  const t=(now-start)/1000;
  // Start with the younger character. The candle enters after a short pause.
  if(t<1.4){
    young.style.opacity='1';older.style.opacity='0';candle.style.opacity='0';setCaption('',false);
    fullFire.style.opacity='0';drawFire(now,0);
  }else if(t<2.25){
    candle.style.opacity='1';
    candle.style.left='50%';candle.style.top='52%';
    candle.style.transform='translate(-50%,-50%) rotate(0deg)';
    candleFlame.style.opacity='0';
    setCaption('A MOMENT OF SILENCE');
    drawFire(now,0);
  }else if(t<2.95){
    const p=(t-2.25)/.7;
    candle.style.transform=`translate(-50%,-50%) rotate(${p*88}deg) translateY(${p*24}px)`;
    setCaption('THE FALL');
    drawFire(now,p*.15);
  }else if(t<4.8){
    candle.style.transform='translate(-50%,-50%) rotate(88deg) translateY(24px)';
    candleFlame.style.opacity='1';
    const amount=Math.min(1,(t-2.95)/1.15);
    fullFire.style.opacity=String(amount*.95);
    drawFire(now,amount);
    setCaption('IGNITE',true);
  }else if(t<5.7){
    // Full-screen fire hides the transition between the two pictures.
    fullFire.style.opacity='1';drawFire(now,1);
    young.style.opacity='0';older.style.opacity='1';older.style.transform='scale(1.0)';
    setCaption('',false);
  }else{
    // Reveal the second image and put the candle where the girl was, replacing her visually.
    fullFire.style.opacity=String(Math.max(0,1-(t-5.7)*1.9));
    drawFire(now,Math.max(0,1-(t-5.7)*1.5));
    older.style.opacity='1';
    candle.style.opacity='1';
    candle.style.left='78%';candle.style.top='69%';
    candle.style.width='clamp(26px,4vw,54px)';
    candle.style.height='clamp(110px,20vh,180px)';
    candle.style.transform=`translate(-50%,-50%) rotate(${Math.sin(now*.002)*2}deg)`;
    candleFlame.style.opacity='1';
    setCaption('THE GAME CHANGES', t<8.5);
    if(t>11){start=now;embers=[]}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('replay').addEventListener('click',()=>{start=performance.now();embers=[];young.style.opacity='1';older.style.opacity='0';candle.style.opacity='0';fullFire.style.opacity='0'});
</script>
